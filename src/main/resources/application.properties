server.port=${PORT:8085}

# Application Name
spring.application.name=HealthManagementSystem

# Default Datasource: In-memory H2 in MySQL Compatibility Mode (Immediate zero-setup execution)
spring.datasource.url=jdbc:h2:mem:health_management_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==============================================================================
# MySQL Production / Local Configuration
# Uncomment the following lines to connect directly to your local MySQL 8.0 server:
# ==============================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/health_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password

# SQL Schema and Seed Data Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Static Frontend Resource Location
spring.web.resources.static-locations=file:frontend/,file:../frontend/,classpath:/static/

# Logging Configuration
logging.level.com.healthcare.hms=INFO
logging.level.org.springframework.jdbc=INFO
